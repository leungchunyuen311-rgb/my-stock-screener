<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>美股期權量化選股終端 (PRO)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuantApp">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2422/2422796.png">
  <meta name="theme-color" content="#0B0F19">

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom, 20px); }
    .sticky-col { position: sticky; left: 0; z-index: 10; }
  </style>
</head>
<body class="bg-[#F8F9FA] dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased pb-20 select-none">

  <!-- 頂部固定導覽列 -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-[#0B0F19]/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">📈</span>
        <div>
          <h1 class="font-extrabold text-sm tracking-tight bg-gradient-to-r from-emerald-500 to-teal-400 bg-clip-text text-transparent">
            PRO QUANT SCREENER
          </h1>
          <div class="text-[9px] font-mono text-slate-400 leading-none">結構日期 <span id="header-date">更新中...</span> · 最新 ↕</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="view-mode-btn" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-xs text-slate-600 dark:text-slate-300 md:hidden" title="切換檢視模式">
          🎴
        </button>
        <button id="guide-btn" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1">
          ❓ 欄位說明
        </button>
        <button id="theme-toggle" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-xs">
          🌙
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 md:p-6 space-y-3.5">
    
    <!-- 今日精選推介卡片 (TOP SETUPS - 嚴禁任何過熱/不宜股票) -->
    <div id="top-setups-section" class="space-y-2">
      <div class="flex items-center justify-between text-xs px-1">
        <span class="font-bold tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          今日精選推介 (TOP SETUPS)
        </span>
        <span class="text-[10px] text-slate-400">點擊開圖</span>
      </div>
      <div id="top-picks" class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
        <div class="col-span-2 md:col-span-4 text-xs text-slate-400 py-2">⏳ 正在篩選「確認到位」之標的...</div>
      </div>
    </div>

    <!-- 完整篩選器面板 (分類、位置、事件、Filter、Setup、IV、OI) -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 md:p-5 shadow-sm space-y-3 text-xs">
      
      <!-- 1. 分類 -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">分類</span>
        <div class="flex items-center gap-1.5" id="filter-category">
          <button data-group="cat" data-val="全部" class="filter-btn active px-2.5 py-1 rounded border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold shrink-0">全部</button>
          <button data-group="cat" data-val="穩陣" class="filter-btn px-2.5 py-1 rounded border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 shrink-0">穩陣</button>
          <button data-group="cat" data-val="睇位" class="filter-btn px-2.5 py-1 rounded border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 shrink-0">睇位</button>
          <button data-group="cat" data-val="留神" class="filter-btn px-2.5 py-1 rounded border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 shrink-0">留神</button>
          <button id="watchlist-filter-btn" class="px-2.5 py-1 rounded border border-amber-500/40 text-amber-500 bg-amber-500/5 font-semibold shrink-0">
            ⭐ 我的自選 (<span id="watchlist-count">0</span>)
          </button>
        </div>
      </div>

      <!-- 2. 位置 (ZONE) -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">位置</span>
        <div class="flex items-center gap-1.5" id="filter-position">
          <button data-group="pos" data-val="過熱" class="filter-btn px-2.5 py-0.5 rounded border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5 font-medium shrink-0">過熱</button>
          <button data-group="pos" data-val="偏強" class="filter-btn px-2.5 py-0.5 rounded border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 font-medium shrink-0">偏強</button>
          <button data-group="pos" data-val="中性" class="filter-btn px-2.5 py-0.5 rounded border border-slate-200 dark:border-slate-800 text-slate-500 shrink-0">中性</button>
          <button data-group="pos" data-val="偏弱" class="filter-btn px-2.5 py-0.5 rounded border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5 font-medium shrink-0">偏弱</button>
          <button data-group="pos" data-val="超賣" class="filter-btn px-2.5 py-0.5 rounded border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5 font-medium shrink-0">超賣</button>
        </div>
      </div>

      <!-- 3. 事件 (EVENT) -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">事件</span>
        <div class="flex items-center gap-1.5" id="filter-event">
          <button data-group="event" data-val="Clear" class="filter-btn px-2.5 py-0.5 rounded border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 shrink-0">Clear</button>
          <button data-group="event" data-val="Block" class="filter-btn px-2.5 py-0.5 rounded border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5 shrink-0">Block</button>
        </div>
      </div>

      <!-- 4. Filter 狀態 -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">Filter</span>
        <div class="flex items-center gap-1.5" id="filter-status-group">
          <button data-group="fstatus" data-val="觀望" class="filter-btn px-2.5 py-0.5 rounded border border-amber-500/30 text-amber-600 dark:text-amber-400 bg-amber-500/5 shrink-0">觀望</button>
          <button data-group="fstatus" data-val="確認" class="filter-btn px-2.5 py-0.5 rounded border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 shrink-0">確認</button>
          <button data-group="fstatus" data-val="規避" class="filter-btn px-2.5 py-0.5 rounded border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5 shrink-0">規避</button>
          <button data-group="fstatus" data-val="不宜" class="filter-btn px-2.5 py-0.5 rounded border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5 shrink-0">不宜</button>
        </div>
      </div>

      <!-- 5. Setup 期權架構 -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">Setup</span>
        <div class="flex items-center gap-1.5" id="filter-setup-group">
          <button data-group="setup" data-val="W Wheel" class="filter-btn px-2.5 py-0.5 rounded border border-amber-500/30 text-amber-600 dark:text-amber-400 bg-amber-500/5 font-semibold shrink-0">W Wheel</button>
          <button data-group="setup" data-val="L LEAPS" class="filter-btn px-2.5 py-0.5 rounded border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5 font-semibold shrink-0">L LEAPS</button>
          <button data-group="setup" data-val="P PMCC" class="filter-btn px-2.5 py-0.5 rounded border border-purple-500/30 text-purple-600 dark:text-purple-400 bg-purple-500/5 font-semibold shrink-0">P PMCC</button>
          <button data-group="setup" data-val="Z ZEBRA" class="filter-btn px-2.5 py-0.5 rounded border border-teal-500/30 text-teal-600 dark:text-teal-400 bg-teal-500/5 font-semibold shrink-0">Z ZEBRA</button>
        </div>
      </div>

      <!-- 6. IV %ile -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">IV %ile</span>
        <div class="flex items-center gap-1.5" id="filter-iv-group">
          <button data-group="ivrange" data-val="極平" class="filter-btn px-2.5 py-0.5 rounded border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5 shrink-0">極平</button>
          <button data-group="ivrange" data-val="偏平" class="filter-btn px-2.5 py-0.5 rounded border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5 shrink-0">偏平</button>
          <button data-group="ivrange" data-val="中性" class="filter-btn px-2.5 py-0.5 rounded border border-slate-200 dark:border-slate-800 text-slate-500 shrink-0">中性</button>
          <button data-group="ivrange" data-val="偏貴" class="filter-btn px-2.5 py-0.5 rounded border border-amber-500/30 text-amber-600 dark:text-amber-400 bg-amber-500/5 shrink-0">偏貴</button>
          <button data-group="ivrange" data-val="極貴" class="filter-btn px-2.5 py-0.5 rounded border border-orange-500/30 text-orange-600 dark:text-orange-400 bg-orange-500/5 shrink-0">極貴</button>
        </div>
      </div>

      <!-- 7. OI 籌碼 -->
      <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <span class="w-14 text-slate-400 font-medium shrink-0">OI</span>
        <div class="flex items-center gap-1.5" id="filter-oi-group">
          <button data-group="oi" data-val="OI 同向" class="filter-btn px-2.5 py-0.5 rounded border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 font-semibold shrink-0">OI 同向</button>
          <button data-group="oi" data-val="OI 壓頂" class="filter-btn px-2.5 py-0.5 rounded border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5 font-semibold shrink-0">OI 壓頂</button>
        </div>
      </div>

      <!-- 工具欄 -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2 border-t border-slate-100 dark:border-slate-800/80">
        <div class="flex items-center gap-2">
          <span class="text-[11px] text-slate-400">同一列為「或」，不同列之間為「且」</span>
          <button id="clear-btn" class="px-2.5 py-1 text-slate-500 border border-slate-200 dark:border-slate-800 rounded hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 text-xs">
            清除
          </button>
        </div>
        <div class="flex items-center justify-between sm:justify-end gap-3">
          <input id="search-input" type="text" placeholder="搜尋 TICKER (如 MU, NVDA)..." class="bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-1 text-xs focus:outline-none focus:border-emerald-500 w-44 font-mono">
          <div id="count-display" class="font-mono text-xs font-bold text-emerald-500 bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-500/20 shrink-0">
            0 / 0
          </div>
        </div>
      </div>
    </div>

    <!-- 手機卡片清單模式 -->
    <div id="mobile-cards-view" class="space-y-2.5 md:hidden"></div>

    <!-- 桌面完整表格模式 -->
    <div id="desktop-table-view" class="hidden md:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto max-h-[72vh]">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-400 font-semibold sticky top-0 z-20 backdrop-blur">
            <tr class="border-b border-slate-200 dark:border-slate-800">
              <th class="p-3 w-10 text-center">⭐</th>
              <th class="p-3 w-12 text-center cursor-pointer select-none" onclick="sortBy('rank')"># ↓</th>
              <th class="p-3 w-32 cursor-pointer select-none sticky-col bg-slate-100 dark:bg-slate-800" onclick="sortBy('ticker')">TICKER ↕</th>
              <th class="p-3 w-24 text-right cursor-pointer select-none" onclick="sortBy('price')">SPOT ↕</th>
              <th class="p-3 w-20 text-center cursor-pointer select-none" onclick="sortBy('position')">ZONE ↕</th>
              <th class="p-3 w-20 text-center">Filter</th>
              <th class="p-3 w-24 text-center">Setup</th>
              <th class="p-3 w-24 text-center">OI</th>
              <th class="p-3 w-24 text-right cursor-pointer select-none" onclick="sortBy('d20')">D20 ↕</th>
              <th class="p-3 w-24 text-right cursor-pointer select-none" onclick="sortBy('d50')">D50 ↕</th>
              <th class="p-3 w-24 text-right cursor-pointer select-none" onclick="sortBy('d200')">D200 ↕</th>
              <th class="p-3 w-18 text-center cursor-pointer select-none" onclick="sortBy('rsi')">RSI ↕</th>
              <th class="p-3 w-18 text-center cursor-pointer select-none" onclick="sortBy('iv')">IV% ↕</th>
              <th class="p-3 w-20 text-center">EVENT</th>
              <th class="p-3 w-14 text-center">圖表</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 手機底部原生導覽列 -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white/95 dark:bg-[#0B0F19]/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 flex items-center justify-around py-2 z-40 text-[10px] text-slate-500 font-medium">
    <button onclick="switchTab('all')" id="nav-all" class="flex flex-col items-center gap-0.5 text-emerald-500 font-bold">
      <span class="text-base">📊</span>
      <span>全部標的</span>
    </button>
    <button onclick="switchTab('watchlist')" id="nav-watchlist" class="flex flex-col items-center gap-0.5">
      <span class="text-base">⭐</span>
      <span>自選 (<span id="nav-watch-count">0</span>)</span>
    </button>
    <button onclick="switchTab('confirmed')" id="nav-signals" class="flex flex-col items-center gap-0.5">
      <span class="text-base">🎯</span>
      <span>確認標的</span>
    </button>
    <button onclick="document.getElementById('guide-modal').classList.remove('hidden')" class="flex flex-col items-center gap-0.5">
      <span class="text-base">📘</span>
      <span>說明指南</span>
    </button>
  </nav>

  <!-- 內嵌 TradingView 即時專業圖表彈窗 -->
  <div id="chart-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end md:justify-center p-0 md:p-6 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-900 border-t md:border border-slate-200 dark:border-slate-800 rounded-t-2xl md:rounded-2xl max-w-5xl w-full h-[92vh] md:h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-800/60">
        <div class="flex items-center gap-2">
          <span id="modal-ticker" class="text-lg font-black font-mono text-slate-900 dark:text-white">AAPL</span>
          <span id="modal-badge" class="px-2 py-0.5 rounded text-[10px] font-bold font-mono">--</span>
          <span id="modal-setup" class="px-1.5 py-0.5 rounded text-[10px] font-bold font-mono bg-blue-500/10 text-blue-400">--</span>
          <span id="modal-price" class="text-xs font-mono font-bold text-slate-700 dark:text-slate-300">$0.00</span>
        </div>
        <div class="flex items-center gap-2">
          <a id="modal-tv-link" href="#" target="_blank" class="px-2 py-1 text-[11px] rounded border border-slate-20
