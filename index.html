<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股期權量化選股終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .sticky-col { position: sticky; left: 0; z-index: 10; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen p-3 md:p-6 font-sans antialiased transition-colors duration-200">
  <div class="max-w-6xl mx-auto space-y-4">
    
    <!-- 頂部標題列 -->
    <div class="flex items-center justify-between py-1">
      <div class="flex items-center gap-2.5">
        <span class="text-xl">📈</span>
        <h1 class="font-extrabold text-base md:text-lg tracking-tight bg-gradient-to-r from-emerald-500 to-teal-400 bg-clip-text text-transparent">
          PRO QUANT SCREENER
        </h1>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-mono font-semibold">S&P 500</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          🌙
        </button>
      </div>
    </div>

    <!-- 頂部精選推介卡片 (Top Setups) -->
    <div class="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 rounded-xl p-4 shadow-sm backdrop-blur">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <h2 class="font-bold text-xs md:text-sm tracking-wide uppercase text-slate-700 dark:text-slate-300">今日量化精選推介 (Top Setups)</h2>
        </div>
        <span class="text-[11px] text-slate-400">點擊代號直達 TradingView 實時圖</span>
      </div>
      <div id="top-picks" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="col-span-4 text-xs text-slate-400 py-2">⏳ 正在計算精選標的...</div>
      </div>
    </div>

    <!-- 篩選器面板 -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 md:p-5 shadow-sm space-y-3.5 text-xs">
      
      <!-- 0. 推薦訊號 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">推薦訊號</span>
        <div class="flex flex-wrap gap-1.5" id="filter-signal">
          <button data-group="signal" data-val="全部" class="filter-btn active px-2.5 py-1 rounded-md border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold">全部</button>
          <button data-group="signal" data-val="回踩買入" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 hover:bg-emerald-500/10">🟢 回踩買入</button>
          <button data-group="signal" data-val="沽 Put" class="filter-btn px-2.5 py-1 rounded-md border border-purple-500/30 text-purple-600 dark:text-purple-400 bg-purple-500/5 hover:bg-purple-500/10">🟣 沽 Put</button>
          <button data-group="signal" data-val="超賣反彈" class="filter-btn px-2.5 py-1 rounded-md border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5 hover:bg-cyan-500/10">🔵 超賣反彈</button>
          <button data-group="signal" data-val="動量突破" class="filter-btn px-2.5 py-1 rounded-md border border-amber-500/30 text-amber-600 dark:text-amber-400 bg-amber-500/5 hover:bg-amber-500/10">🔥 動量突破</button>
        </div>
      </div>

      <!-- 1. 分類與自選 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">分類</span>
        <div class="flex flex-wrap gap-1.5" id="filter-category">
          <button id="watchlist-filter-btn" class="px-2.5 py-1 rounded-md border border-amber-500/40 text-amber-600 dark:text-amber-400 bg-amber-500/5 hover:bg-amber-500/15 font-semibold flex items-center gap-1">
            ⭐ 我的自選 (<span id="watchlist-count">0</span>)
          </button>
          <button data-group="cat" data-val="穩陣" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">穩陣</button>
          <button data-group="cat" data-val="睇位" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">睇位</button>
          <button data-group="cat" data-val="留神" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">留神</button>
        </div>
      </div>

      <!-- 2. 位置 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">位置</span>
        <div class="flex flex-wrap gap-1.5" id="filter-position">
          <button data-group="pos" data-val="過熱 Extended" class="filter-btn px-2.5 py-1 rounded-md border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5">過熱</button>
          <button data-group="pos" data-val="偏強" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5">偏強</button>
          <button data-group="pos" data-val="中性" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-500">中性</button>
          <button data-group="pos" data-val="偏弱" class="filter-btn px-2.5 py-1 rounded-md border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5">偏弱</button>
          <button data-group="pos" data-val="超賣 Oversold" class="filter-btn px-2.5 py-1 rounded-md border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5">超賣</button>
        </div>
      </div>

      <!-- 3. 事件風險 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">事件</span>
        <div class="flex flex-wrap gap-1.5" id="filter-event">
          <button data-group="event" data-val="Clear" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5">Clear (安全無業績)</button>
          <button data-group="event" data-val="Block" class="filter-btn px-2.5 py-1 rounded-md border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5">Block (即將業績)</button>
        </div>
      </div>

      <!-- 搜尋與清除 -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2 border-t border-slate-100 dark:border-slate-800/80">
        <div class="flex items-center gap-2">
          <input id="search-input" type="text" placeholder="搜尋代號 (如 ZBRA / AAPL)..." class="bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:border-emerald-500 w-full sm:w-56 font-mono">
          <button id="clear-btn" class="px-2.5 py-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 border border-slate-200 dark:border-slate-800 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">
            清除篩選
          </button>
        </div>
        <div class="text-slate-400 text-xs text-right font-mono flex items-center justify-end gap-2">
          <span>符合標的：</span>
          <span id="count-display" class="font-bold text-emerald-500 text-sm">載入中...</span>
        </div>
      </div>
    </div>

    <!-- 數據表格 -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto max-h-[70vh]">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100/80 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 font-semibold sticky top-0 z-20 backdrop-blur">
            <tr class="border-b border-slate-200 dark:border-slate-800">
              <th class="p-3 w-10 text-center">⭐</th>
              <th class="p-3 w-28 cursor-pointer select-none sticky-col bg-slate-100/90 dark:bg-slate-800/90" onclick="sortBy('ticker')">TICKER ↕</th>
              <th class="p-3 w-28">訊號</th>
              <th class="p-3 w-24">位置</th>
              <th class="p-3 w-36 text-right cursor-pointer select-none" onclick="sortBy('d20')">D20 (20MA) ↕</th>
              <th class="p-3 w-36 text-right cursor-pointer select-none" onclick="sortBy('d200')">D200 (200MA) ↕</th>
              <th class="p-3 w-20 text-center cursor-pointer select-none" onclick="sortBy('iv')">IV% ↕</th>
              <th class="p-3 w-28 text-center">EVENT</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono">
            <tr><td colspan="8" class="p-8 text-center text-slate-400">正在渲染 500 隻股票數據...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let rawData = [];
    let watchlist = JSON.parse(localStorage.getItem('my_watchlist') || '[]');
    let activeFilters = { signal: [], cat: [], pos: [], event: [], watchlistOnly: false };
    let sortKey = 'd200';
    let sortAsc = false;
    let searchQuery = '';

    // 主題切換
    const themeToggleBtn = document.getElementById('theme-toggle');
    const isDark = localStorage.getItem('theme') !== 'light';
    if (!isDark) document.documentElement.classList.remove('dark');
    themeToggleBtn.textContent = isDark ? '🌙' : '☀️';

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const currentDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', currentDark ? 'dark' : 'light');
      themeToggleBtn.textContent = currentDark ? '🌙' : '☀️';
    });

    // 抓取數據並安全渲染
    fetch('screener_data.json')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        // 標準化欄位資料，避免缺失欄位造成當機
        rawData = data.map(d => {
          const d20 = (typeof d.d20 === 'number') ? d.d20 : 0;
          const d200 = (typeof d.d200 === 'number') ? d.d200 : 0;
          const iv = (typeof d.iv === 'number') ? d.iv : 0;
          const pos = d.position || (d20 >= 10 ? '過熱 Extended' : d20 >= 2 ? '偏強' : d20 <= -10 ? '超賣 Oversold' : d20 <= -2 ? '偏弱' : '中性');
          const cat = d.category || (d200 > 10 ? '穩陣' : d200 < -10 ? '留神' : '睇位');
          const evt = d.event || 'Clear';
          
          // 若無 signal 則即時計算
          let sig = d.signal || '觀望';
          let sigReason = d.signal_reason || '';
          if (sig === '觀望') {
            if (d200 >= 8 && d20 >= -3.5 && d20 <= 2.5 && evt === 'Clear') {
              sig = '回踩買入';
              sigReason = `長線牛市 (D200 +${d200}%)，回踩 20MA 支撐位`;
            } else if (d200 >= 0 && iv >= 45 && d20 <= 0 && evt === 'Clear') {
              sig = '沽 Put';
              sigReason = `IV 較高 (${iv}%)，無業績地雷，適合賺取權利金`;
            } else if (d20 <= -8 && d200 >= -8 && evt === 'Clear') {
              sig = '超賣反彈';
              sigReason = `短線嚴重超賣 (D20 ${d20}%)，具備反彈修復空間`;
            } else if (d200 >= 20 && d20 >= 6 && evt === 'Clear') {
              sig = '動量突破';
              sigReason = `多頭加速推進 (D200 +${d200}%, D20 +${d20}%)`;
            }
          }

          return {
            ticker: d.ticker || '',
            name: d.name || d.ticker || '',
            price: d.price || 0,
            category: cat,
            position: pos,
            d20: d20,
            d200: d200,
            iv: iv,
            event: evt,
            event_date: d.event_date || '',
            signal: sig,
            signal_reason: sigReason
          };
        });

        updateWatchlistCount();
        renderTopPicks();
        applyFiltersAndRender();
      })
      .catch(err => {
        document.getElementById('count-display').textContent = '讀取失敗: ' + err.message;
      });

    function toggleWatchlist(ticker, e) {
      e.stopPropagation();
      if (watchlist.includes(ticker)) {
        watchlist = watchlist.filter(t => t !== ticker);
      } else {
        watchlist.push(ticker);
      }
      localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
      updateWatchlistCount();
      applyFiltersAndRender();
    }

    function updateWatchlistCount() {
      document.getElementById('watchlist-count').textContent = watchlist.length;
    }

    document.getElementById('watchlist-filter-btn').addEventListener('click', () => {
      activeFilters.watchlistOnly = !activeFilters.watchlistOnly;
      const btn = document.getElementById('watchlist-filter-btn');
      if (activeFilters.watchlistOnly) {
        btn.classList.add('ring-2', 'ring-amber-500', 'bg-amber-500/20');
      } else {
        btn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-500/20');
      }
      applyFiltersAndRender();
    });

    function renderTopPicks() {
      const topPicksContainer = document.getElementById('top-picks');
      // 自動挑選出最強的 4 隻標的
      const candidates = rawData
        .filter(d => d.signal !== '觀望' && d.event === 'Clear')
        .sort((a, b) => b.d200 - a.d200)
        .slice(0, 4);

      if (candidates.length === 0) {
        topPicksContainer.innerHTML = '<div class="col-span-4 text-xs text-slate-400 py-2">今日暫無符合條件之標的，建議觀望。</div>';
        return;
      }

      topPicksContainer.innerHTML = candidates.map(d => `
        <div class="bg-slate-50 dark:bg-slate-800/60 rounded-lg p-3 border border-slate-200 dark:border-slate-700/60 hover:border-emerald-500/50 transition-all flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between">
              <a href="https://www.tradingview.com/chart/?symbol=${d.ticker}" target="_blank" class="font-bold text-slate-900 dark:text-white text-sm hover:text-emerald-400 transition-colors flex items-center gap-1 font-mono">
                ${d.ticker} <span class="text-[10px] text-slate-400">↗</span>
              </a>
              <span class="text-[11px] px-2 py-0.5 rounded font-semibold ${
                d.signal === '回踩買入' ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' :
                d.signal === '沽 Put' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' :
                'bg-amber-500/10 text-amber-400 border border-amber-500/20'
              }">${d.signal}</span>
            </div>
            <div class="text-[11px] text-slate-400 truncate mt-0.5 font-sans">${d.name}</div>
            <div class="text-[11px] text-slate-600 dark:text-slate-300 mt-2 bg-white dark:bg-slate-900/80 p-2 rounded border border-slate-100 dark:border-slate-800 leading-snug font-sans">
              ${d.signal_reason || '長線強勢回踩中'}
            </div>
          </div>
          <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-700/50 font-mono">
            <span>D20: <b class="${d.d20 >= 0 ? 'text-emerald-500':'text-rose-500'}">${d.d20 > 0 ? '+':''}${d.d20}%</b></span>
            <span>D200: <b class="text-emerald-500">+${d.d200}%</b></span>
            <span>IV: <b class="text-slate-700 dark:text-slate-200">${d.iv}%</b></span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toUpperCase();
      applyFiltersAndRender();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const val = btn.dataset.val;

        if (val === '全部') {
          activeFilters[group] = [];
          document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('ring-2', 'ring-emerald-500', 'font-bold'));
          btn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-500');
        } else {
          const allBtn = document.querySelector(`[data-group="${group}"][data-val="全部"]`);
          if (allBtn) allBtn.classList.remove('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-500');

          if (activeFilters[group].includes(val)) {
            activeFilters[group] = activeFilters[group].filter(item => item !== val);
            btn.classList.remove('ring-2', 'ring-emerald-500', 'font-bold');
          } else {
            activeFilters[group].push(val);
            btn.classList.add('ring-2', 'ring-emerald-500', 'font-bold');
          }
        }
        applyFiltersAndRender();
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      activeFilters = { signal: [], cat: [], pos: [], event: [], watchlistOnly: false };
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-2', 'ring-emerald-500', 'font-bold'));
      document.getElementById('watchlist-filter-btn').classList.remove('ring-2', 'ring-amber-500', 'bg-amber-500/20');
      const allBtn = document.querySelector(`[data-group="signal"][data-val="全部"]`);
      if (allBtn) allBtn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-500');
      document.getElementById('search-input').value = '';
      searchQuery = '';
      applyFiltersAndRender();
    });

    function applyFiltersAndRender() {
      let filtered = rawData.filter(d => {
        if (activeFilters.watchlistOnly && !watchlist.includes(d.ticker)) return false;
        if (searchQuery && !d.ticker.includes(searchQuery) && !d.name.toUpperCase().includes(searchQuery)) return false;
        if (activeFilters.signal.length > 0 && !activeFilters.signal.includes(d.signal)) return false;
        if (activeFilters.cat.length > 0 && !activeFilters.cat.includes(d.category)) return false;
        if (activeFilters.pos.length > 0 && !activeFilters.pos.includes(d.position)) return false;
        if (activeFilters.event.length > 0 && !activeFilters.event.includes(d.event)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        let valA = a[sortKey] !== undefined ? a[sortKey] : 0;
        let valB = b[sortKey] !== undefined ? b[sortKey] : 0;
        if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        return sortAsc ? (valA - valB) : (valB - valA);
      });

      render(filtered);
    }

    function sortBy(key) {
      if (sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = false; }
      applyFiltersAndRender();
    }

    function render(data) {
      document.getElementById('count-display').textContent = `${data.length} / ${rawData.length}`;
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = data.map((d, idx) => {
        const isWatched = watchlist.includes(d.ticker);
        const d20Width = Math.min(Math.abs(d.d20) * 4, 100);
        const d200Width = Math.min(Math.abs(d.d200) * 1.5, 100);

        return `
        <tr class="hover:bg-slate-100/60 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-800/60">
          <td class="p-3 text-center cursor-pointer select-none text-base" onclick="toggleWatchlist('${d.ticker}', event)">
            ${isWatched ? '⭐' : '<span class="text-slate-300 dark:text-slate-600 hover:text-amber-400">☆</span>'}
          </td>
          <td class="p-3 sticky-col bg-white dark:bg-[#0B0F19]">
            <a href="https://www.tradingview.com/chart/?symbol=${d.ticker}" target="_blank" class="font-bold text-slate-900 dark:text-slate-100 hover:text-emerald-400 transition-colors flex items-center gap-1 font-mono">
              ${d.ticker} <span class="text-[10px] text-slate-400">↗</span>
            </a>
            <div class="text-[10px] text-slate-400 truncate max-w-[120px] font-sans">${d.name}</div>
          </td>
          <td class="p-3">
            <span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold ${
              d.signal === '回踩買入' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30' :
              d.signal === '沽 Put' ? 'bg-purple-500/15 text-purple-600 dark:text-purple-400 border border-purple-500/30' :
              d.signal === '超賣反彈' ? 'bg-cyan-500/15 text-cyan-600 dark:text-cyan-400 border border-cyan-500/30' :
              d.signal === '動量突破' ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30' :
              'text-slate-400 dark:text-slate-600'
            }" title="${d.signal_reason}">
              ${d.signal !== '觀望' ? d.signal : '—'}
            </span>
          </td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-sans border ${
              d.position.includes('強') ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' :
              d.position.includes('熱') ? 'bg-rose-500/10 text-rose-500 border-rose-500/20' :
              d.position.includes('弱') ? 'bg-blue-500/10 text-blue-500 border-blue-500/20' :
              d.position.includes('超賣') ? 'bg-cyan-500/10 text-cyan-500 border-cyan-500/20' :
              'text-slate-400 border-slate-200 dark:border-slate-800'
            }">${d.position}</span>
          </td>
          <td class="p-3 text-right">
            <div class="relative flex items-center justify-end">
              <div class="absolute right-0 h-4 rounded-sm opacity-20 ${d.d20 >= 0 ? 'bg-emerald-500':'bg-rose-500'}" style="width: ${d20Width}%;"></div>
              <span class="relative z-1 font-semibold ${d.d20 >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                ${d.d20 > 0 ? '+' : ''}${d.d20}%
              </span>
            </div>
          </td>
          <td class="p-3 text-right">
            <div class="relative flex items-center justify-end">
              <div class="absolute right-0 h-4 rounded-sm opacity-20 ${d.d200 >= 0 ? 'bg-emerald-500':'bg-rose-500'}" style="width: ${d200Width}%;"></div>
              <span class="relative z-1 font-semibold ${d.d200 >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                ${d.d200 > 0 ? '+' : ''}${d.d200}%
              </span>
            </div>
          </td>
          <td class="p-3 text-center font-bold text-slate-700 dark:text-slate-300">${d.iv > 0 ? d.iv : '-'}</td>
          <td class="p-3 text-center">
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium border ${
              d.event === 'Clear' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-rose-500/10 text-rose-500 border-rose-500/20'
            }">
              ${d.event} ${d.event_date ? '<div class="text-[9px] opacity-75">' + d.event_date + '</div>' : ''}
            </span>
          </td>
        </tr>
      `}).join('');
    }
  </script>
</body>
</html>
