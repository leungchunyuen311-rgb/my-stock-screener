<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股量化選股與買入推介儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8F9FA] text-gray-800 p-3 md:p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-5">
    
    <!-- 今日精選買入推介卡片 (Top Setups) -->
    <div class="bg-gradient-to-r from-emerald-500/10 via-teal-500/5 to-transparent border border-emerald-200/60 rounded-xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-lg">🎯</span>
          <h2 class="font-bold text-gray-900 text-base">今日量化精選推介 (Top Actionable Setups)</h2>
        </div>
        <span class="text-xs text-gray-500">點擊代號直達 TradingView 圖表</span>
      </div>
      <div id="top-picks" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <!-- 由 JS 動態載入最高分的 4 隻股票 -->
      </div>
    </div>

    <!-- 主要篩選器與表格卡片 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 md:p-7">
      
      <!-- 篩選器區塊 -->
      <div class="space-y-3 pb-5 border-b border-gray-100 text-sm">
        
        <!-- 0. 買入推薦訊號 (新增加) -->
        <div class="flex items-center gap-3">
          <span class="w-16 text-gray-400 font-medium text-xs">推薦訊號</span>
          <div class="flex flex-wrap gap-1.5" id="filter-signal">
            <button data-group="signal" data-val="全部" class="filter-btn px-2.5 py-1 rounded border text-emerald-700 border-emerald-500 bg-emerald-50 font-medium">全部</button>
            <button data-group="signal" data-val="回踩買入" class="filter-btn px-2.5 py-1 rounded border border-emerald-300 text-emerald-800 bg-emerald-100/60 font-medium">🟢 回踩買入</button>
            <button data-group="signal" data-val="沽 Put" class="filter-btn px-2.5 py-1 rounded border border-purple-300 text-purple-800 bg-purple-100/60 font-medium">🟣 沽 Put</button>
            <button data-group="signal" data-val="超賣反彈" class="filter-btn px-2.5 py-1 rounded border border-cyan-300 text-cyan-800 bg-cyan-100/60 font-medium">🔵 超賣反彈</button>
            <button data-group="signal" data-val="動量突破" class="filter-btn px-2.5 py-1 rounded border border-orange-300 text-orange-800 bg-orange-100/60 font-medium">🔥 動量突破</button>
          </div>
        </div>

        <!-- 1. 分類 -->
        <div class="flex items-center gap-3">
          <span class="w-16 text-gray-400 font-medium text-xs">分類</span>
          <div class="flex flex-wrap gap-1.5" id="filter-category">
            <button data-group="cat" data-val="穩陣" class="filter-btn px-2.5 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-50">穩陣</button>
            <button data-group="cat" data-val="睇位" class="filter-btn px-2.5 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-50">睇位</button>
            <button data-group="cat" data-val="留神" class="filter-btn px-2.5 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-50">留神</button>
          </div>
        </div>

        <!-- 2. 位置 -->
        <div class="flex items-center gap-3">
          <span class="w-16 text-gray-400 font-medium text-xs">位置</span>
          <div class="flex flex-wrap gap-1.5" id="filter-position">
            <button data-group="pos" data-val="過熱 Extended" class="filter-btn px-2.5 py-1 rounded border border-orange-200 text-orange-700 bg-orange-50/50">過熱</button>
            <button data-group="pos" data-val="偏強" class="filter-btn px-2.5 py-1 rounded border border-emerald-200 text-emerald-700 bg-emerald-50/50">偏強</button>
            <button data-group="pos" data-val="中性" class="filter-btn px-2.5 py-1 rounded border border-gray-200 text-gray-600">中性</button>
            <button data-group="pos" data-val="偏弱" class="filter-btn px-2.5 py-1 rounded border border-blue-200 text-blue-700 bg-blue-50/50">偏弱</button>
            <button data-group="pos" data-val="超賣 Oversold" class="filter-btn px-2.5 py-1 rounded border border-cyan-200 text-cyan-700 bg-cyan-50/50">超賣</button>
          </div>
        </div>

        <!-- 3. 事件 -->
        <div class="flex items-center gap-3">
          <span class="w-16 text-gray-400 font-medium text-xs">事件</span>
          <div class="flex flex-wrap gap-1.5" id="filter-event">
            <button data-group="event" data-val="Clear" class="filter-btn px-2.5 py-1 rounded border border-emerald-200 text-emerald-700 bg-emerald-50/50">Clear (無業績)</button>
            <button data-group="event" data-val="Block" class="filter-btn px-2.5 py-1 rounded border border-rose-200 text-rose-700 bg-rose-50/50">Block (即將業績)</button>
          </div>
        </div>

        <!-- 說明與清除 -->
        <div class="flex items-center justify-between pt-2 text-xs text-gray-400">
          <span>同一列為「或」，不同列之間為「且」</span>
          <button id="clear-btn" class="px-3 py-1 text-gray-500 hover:text-gray-800 border rounded hover:bg-gray-50">清除全部條件</button>
        </div>
      </div>

      <!-- 控制區與搜尋 -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between py-4 gap-3 text-sm text-gray-600">
        <div class="flex items-center gap-3">
          <input id="search-input" type="text" placeholder="搜尋代號 (如 NVDA)..." class="border border-gray-200 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 w-48">
          <span class="text-xs text-gray-400">|</span>
          <span class="text-xs text-gray-500">標普 500 實時數據庫</span>
        </div>
        <div id="count-display" class="font-semibold text-gray-700 text-right">0 / 0</div>
      </div>

      <!-- 數據表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-gray-500 font-medium border-y border-gray-100">
            <tr>
              <th class="p-3 w-10">#</th>
              <th class="p-3 cursor-pointer select-none" onclick="sortBy('ticker')">TICKER ↕</th>
              <th class="p-3">推介訊號</th>
              <th class="p-3">位置</th>
              <th class="p-3 cursor-pointer text-right select-none" onclick="sortBy('d20')">D20 ↕</th>
              <th class="p-3 cursor-pointer text-right select-none" onclick="sortBy('d200')">D200 ↕</th>
              <th class="p-3 cursor-pointer text-center select-none" onclick="sortBy('iv')">IV% ↕</th>
              <th class="p-3 text-center">EVENT</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-gray-50"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let rawData = [];
    let activeFilters = { signal: [], cat: [], pos: [], event: [] };
    let sortKey = 'signal_score';
    let sortAsc = false;
    let searchQuery = '';

    fetch('./screener_data.json?t=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        rawData = data;
        renderTopPicks();
        applyFiltersAndRender();
      });

    // 渲染頂部精選推介卡片
    function renderTopPicks() {
      const topPicksContainer = document.getElementById('top-picks');
      const candidates = rawData
        .filter(d => d.signal !== '觀望' && d.signal_score >= 4)
        .sort((a, b) => b.signal_score - a.signal_score || b.d200 - a.d200)
        .slice(0, 4);

      if (candidates.length === 0) {
        topPicksContainer.innerHTML = '<div class="col-span-4 text-xs text-gray-400 py-2">今日暫未有符合 4 星以上之高勝率推介，建議耐心觀望。</div>';
        return;
      }

      topPicksContainer.innerHTML = candidates.map(d => `
        <div class="bg-white rounded-lg p-3.5 border border-emerald-100 shadow-sm hover:border-emerald-300 transition-all flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between">
              <a href="https://www.tradingview.com/chart/?symbol=${d.ticker}" target="_blank" class="font-black text-gray-900 text-base hover:text-blue-600 transition-colors">
                ${d.ticker} ↗
              </a>
              <span class="text-xs px-2 py-0.5 rounded font-bold ${
                d.signal === '回踩買入' ? 'bg-emerald-100 text-emerald-800' :
                d.signal === '沽 Put' ? 'bg-purple-100 text-purple-800' :
                'bg-orange-100 text-orange-800'
              }">${d.signal}</span>
            </div>
            <div class="text-[11px] text-gray-400 truncate mt-0.5">${d.name}</div>
            <div class="text-xs text-gray-600 mt-2 leading-relaxed bg-gray-50 p-1.5 rounded text-[11px]">
              ${d.signal_reason}
            </div>
          </div>
          <div class="flex items-center justify-between text-xs text-gray-500 mt-3 pt-2 border-t border-gray-100">
            <span>D20: <b class="${d.d20 >= 0 ? 'text-emerald-600':'text-rose-600'}">${d.d20 > 0 ? '+':''}${d.d20}%</b></span>
            <span>D200: <b class="text-emerald-600">+${d.d200}%</b></span>
            <span>IV: <b>${d.iv}%</b></span>
          </div>
        </div>
      `).join('');
    }

    // 搜尋監聽
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toUpperCase();
      applyFiltersAndRender();
    });

    // 篩選按鈕事件
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const val = btn.dataset.val;

        if (val === '全部') {
          activeFilters[group] = [];
          document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'ring-2', 'ring-emerald-500', 'font-bold'));
          btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
        } else {
          const allBtn = document.querySelector(`[data-group="${group}"][data-val="全部"]`);
          if (allBtn) allBtn.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');

          if (activeFilters[group].includes(val)) {
            activeFilters[group] = activeFilters[group].filter(item => item !== val);
            btn.classList.remove('ring-2', 'ring-emerald-500', 'font-bold');
          } else {
            activeFilters[group].push(val);
            btn.classList.add('ring-2', 'ring-emerald-500', 'font-bold');
          }
        }
        applyFiltersAndRender();
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      activeFilters = { signal: [], cat: [], pos: [], event: [] };
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-2', 'ring-emerald-500', 'font-bold'));
      const allBtn = document.querySelector(`[data-group="signal"][data-val="全部"]`);
      if (allBtn) allBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
      document.getElementById('search-input').value = '';
      searchQuery = '';
      applyFiltersAndRender();
    });

    function applyFiltersAndRender() {
      let filtered = rawData.filter(d => {
        if (searchQuery && !d.ticker.includes(searchQuery) && !d.name.toUpperCase().includes(searchQuery)) return false;
        if (activeFilters.signal.length > 0 && !activeFilters.signal.includes(d.signal)) return false;
        if (activeFilters.cat.length > 0 && !activeFilters.cat.includes(d.category)) return false;
        if (activeFilters.pos.length > 0 && !activeFilters.pos.includes(d.position)) return false;
        if (activeFilters.event.length > 0 && !activeFilters.event.includes(d.event)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        return sortAsc ? (a[sortKey] > b[sortKey] ? 1 : -1) : (a[sortKey] < b[sortKey] ? 1 : -1);
      });

      render(filtered);
    }

    function sortBy(key) {
      if (sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = false; }
      applyFiltersAndRender();
    }

    function render(data) {
      document.getElementById('count-display').textContent = `${data.length} / ${rawData.length}`;
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = data.map((d, idx) => `
        <tr class="hover:bg-gray-50/80 transition-colors">
          <td class="p-3 text-gray-400 text-xs">${idx + 1}</td>
          <td class="p-3">
            <a href="https://www.tradingview.com/chart/?symbol=${d.ticker}" target="_blank" class="font-bold text-gray-900 hover:text-blue-600 transition-colors flex items-center gap-1">
              ${d.ticker} <span class="text-[10px] text-gray-400 font-normal">↗</span>
            </a>
            <div class="text-xs text-gray-400 truncate max-w-[130px]">${d.name}</div>
          </td>
          <td class="p-3">
            <span class="inline-block px-2.5 py-0.5 rounded text-xs font-bold ${
              d.signal === '回踩買入' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' :
              d.signal === '沽 Put' ? 'bg-purple-100 text-purple-800 border border-purple-300' :
              d.signal === '超賣反彈' ? 'bg-cyan-100 text-cyan-800 border border-cyan-300' :
              d.signal === '動量突破' ? 'bg-orange-100 text-orange-800 border border-orange-300' :
              'text-gray-400'
            }" title="${d.signal_reason}">
              ${d.signal !== '觀望' ? (d.signal === '回踩買入' ? '🟢 ' : d.signal === '沽 Put' ? '🟣 ' : d.signal === '超賣反彈' ? '🔵 ' : '🔥 ') + d.signal : '—'}
            </span>
          </td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-xs border ${
              d.position.includes('強') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
              d.position.includes('熱') ? 'bg-orange-50 text-orange-700 border-orange-200' :
              d.position.includes('弱') ? 'bg-blue-50 text-blue-700 border-blue-200' :
              d.position.includes('超賣') ? 'bg-cyan-50 text-cyan-700 border-cyan-200' :
              'bg-gray-50 text-gray-600 border-gray-200'
            }">${d.position}</span>
          </td>
          <td class="p-3 text-right font-medium ${d.d20 >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
            ${d.d20 > 0 ? '+' : ''}${d.d20}%
          </td>
          <td class="p-3 text-right font-medium ${d.d200 >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
            ${d.d200 > 0 ? '+' : ''}${d.d200}%
          </td>
          <td class="p-3 text-center font-bold text-gray-700">${d.iv > 0 ? d.iv : '-'}</td>
          <td class="p-3 text-center">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium border ${
              d.event === 'Clear' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200'
            }">
              ${d.event} ${d.event_date ? '<div class="text-[10px] text-gray-400 font-normal">' + d.event_date + '</div>' : ''}
            </span>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
