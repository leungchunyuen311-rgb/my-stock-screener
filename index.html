<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股期權量化選股終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    /* 滾動條美化 */
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .sticky-col { position: sticky; left: 0; z-index: 10; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen p-3 md:p-6 font-sans antialiased transition-colors duration-200">
  <div class="max-w-6xl mx-auto space-y-4">
    
    <!-- 頂部標題列與主題切換 -->
    <div class="flex items-center justify-between py-1">
      <div class="flex items-center gap-2.5">
        <span class="text-xl">📈</span>
        <h1 class="font-extrabold text-base md:text-lg tracking-tight bg-gradient-to-r from-emerald-500 to-teal-400 bg-clip-text text-transparent">
          PRO QUANT SCREENER
        </h1>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-mono font-semibold">S&P 500</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          🌙
        </button>
      </div>
    </div>

    <!-- 頂部精選推介卡片 (Top Setups) -->
    <div class="bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 rounded-xl p-4 shadow-sm backdrop-blur">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <h2 class="font-bold text-xs md:text-sm tracking-wide uppercase text-slate-700 dark:text-slate-300">今日量化精選推介 (Top Setups)</h2>
        </div>
        <span class="text-[11px] text-slate-400">點擊代號直達 TradingView 實時圖</span>
      </div>
      <div id="top-picks" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

    <!-- 篩選器面板 -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 md:p-5 shadow-sm space-y-3.5 text-xs">
      
      <!-- 0. 推薦訊號 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">推薦訊號</span>
        <div class="flex flex-wrap gap-1.5" id="filter-signal">
          <button data-group="signal" data-val="全部" class="filter-btn active px-2.5 py-1 rounded-md border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold">全部</button>
          <button data-group="signal" data-val="回踩買入" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5 hover:bg-emerald-500/10">🟢 回踩買入</button>
          <button data-group="signal" data-val="沽 Put" class="filter-btn px-2.5 py-1 rounded-md border border-purple-500/30 text-purple-600 dark:text-purple-400 bg-purple-500/5 hover:bg-purple-500/10">🟣 沽 Put</button>
          <button data-group="signal" data-val="超賣反彈" class="filter-btn px-2.5 py-1 rounded-md border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5 hover:bg-cyan-500/10">🔵 超賣反彈</button>
          <button data-group="signal" data-val="動量突破" class="filter-btn px-2.5 py-1 rounded-md border border-amber-500/30 text-amber-600 dark:text-amber-400 bg-amber-500/5 hover:bg-amber-500/10">🔥 動量突破</button>
        </div>
      </div>

      <!-- 1. 分類與自選 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">分類</span>
        <div class="flex flex-wrap gap-1.5" id="filter-category">
          <button id="watchlist-filter-btn" class="px-2.5 py-1 rounded-md border border-amber-500/40 text-amber-600 dark:text-amber-400 bg-amber-500/5 hover:bg-amber-500/15 font-semibold flex items-center gap-1">
            ⭐ 我的自選 (<span id="watchlist-count">0</span>)
          </button>
          <button data-group="cat" data-val="穩陣" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">穩陣</button>
          <button data-group="cat" data-val="睇位" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">睇位</button>
          <button data-group="cat" data-val="留神" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">留神</button>
        </div>
      </div>

      <!-- 2. 位置 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">位置</span>
        <div class="flex flex-wrap gap-1.5" id="filter-position">
          <button data-group="pos" data-val="過熱 Extended" class="filter-btn px-2.5 py-1 rounded-md border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5">過熱</button>
          <button data-group="pos" data-val="偏強" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5">偏強</button>
          <button data-group="pos" data-val="中性" class="filter-btn px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 text-slate-500">中性</button>
          <button data-group="pos" data-val="偏弱" class="filter-btn px-2.5 py-1 rounded-md border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/5">偏弱</button>
          <button data-group="pos" data-val="超賣 Oversold" class="filter-btn px-2.5 py-1 rounded-md border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 bg-cyan-500/5">超賣</button>
        </div>
      </div>

      <!-- 3. 事件風險 -->
      <div class="flex items-start md:items-center gap-3">
        <span class="w-14 text-slate-400 font-medium shrink-0 pt-1 md:pt-0">事件</span>
        <div class="flex flex-wrap gap-1.5" id="filter-event">
          <button data-group="event" data-val="Clear" class="filter-btn px-2.5 py-1 rounded-md border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 bg-emerald-500/5">Clear (安全無業績)</button>
          <button data-group="event" data-val="Block" class="filter-btn px-2.5 py-1 rounded-md border border-rose-500/30 text-rose-600 dark:text-rose-400 bg-rose-500/5">Block (即將業績)</button>
        </div>
      </div>

      <!-- 工具欄：搜尋與清除 -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2 border-t border-slate-100 dark:border-slate-800/80">
        <div class="flex items-center gap-2">
          <input id="search-input" type="text" placeholder="搜尋代號 (如 ZBRA / AAPL)..." class="bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:border-emerald-500 w-full sm:w-56 font-mono">
          <button id="clear-btn" class="px-2.5 py-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 border border-slate-200 dark:border-slate-800 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">
            清除篩選
          </button>
        </div>
        <div class="text-slate-400 text-xs text-right font-mono flex items-center justify-end gap-2">
          <span>符合標的：</span>
          <span id="count-display" class="font-bold text-emerald-500 text-sm">0 / 0</span>
        </div>
      </div>
    </div>

    <!-- 數據表格 -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto max-h-[70vh]">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100/80 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 font-semibold sticky top-0 z-20 backdrop-blur">
            <tr class="border-b border-slate-200 dark:border-slate-800">
              <th class="p-3 w-10 text-center">⭐</th>
              <th class="p-3 w-28 cursor-pointer select-none sticky-col bg-slate-100/90 dark:bg-slate-800/90" onclick="sortBy('ticker')">TICKER ↕</th>
              <th class="p-3 w-28">訊號</th>
              <th class="p-3 w-24">位置</th>
              <th class="p-3 w-36 text-right cursor-pointer select-none" onclick="sortBy('d20')">D20 (20MA) ↕</th>
              <th class="p-3 w-36 text-right cursor-pointer select-none" onclick="sortBy('d200')">D200 (200MA) ↕</th>
              <th class="p-3 w-20 text-center cursor-pointer select-none" onclick="sortBy('iv')">IV% ↕</th>
              <th class="p-3 w-28 text-center">EVENT</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono">
            <!-- JS 渲染資料 -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let rawData = [];
    let watchlist = JSON.parse(localStorage.getItem('my_watchlist') || '[]');
    let activeFilters = { signal: [], cat: [], pos: [], event: [], watchlistOnly: false };
    let sortKey = 'signal_score';
    let sortAsc = false;
    let searchQuery = '';

    // 深色模式記憶與切換
    const themeToggleBtn = document.getElementById('theme-toggle');
    const isDark = localStorage.getItem('theme') !== 'light';
    if (!isDark) document.documentElement.classList.remove('dark');
    themeToggleBtn.textContent = isDark ? '🌙' : '☀️';

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const currentDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', currentDark ? 'dark' : 'light');
      themeToggleBtn.textContent = currentDark ? '🌙' : '☀️';
    });

    // 讀取數據
    fetch('./screener_data.json?t=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        rawData = data;
        updateWatchlistCount();
        renderTopPicks();
        applyFiltersAndRender();
      });

    // 自選股功能
    function toggleWatchlist(ticker, e) {
      e.stopPropagation();
      if (watchlist.includes(ticker)) {
        watchlist = watchlist.filter(t => t !== ticker);
      } else {
        watchlist.push(ticker);
      }
      localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
      updateWatchlistCount();
      applyFiltersAndRender();
    }

    function updateWatchlistCount() {
      document.getElementById('watchlist-count').textContent = watchlist.length;
    }

    document.getElementById('watchlist-filter-btn').addEventListener('click', () => {
      activeFilters.watchlistOnly = !activeFilters.watchlistOnly;
      const btn = document.getElementById('watchlist-filter-btn');
      if (activeFilters.watchlistOnly) {
        btn.classList.add('ring-2', 'ring-amber-500', 'bg-amber-500/20');
      } else {
        btn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-500/20');
      }
      applyFiltersAndRender();
    });

    // 渲染頂部精選卡片
    function renderTopPicks() {
      const topPicksContainer = document.getElementById('top-picks');
      const candidates = rawData
        .filter(d => d.signal !== '觀望' && d.signal_score >= 4)
        .sort((a, b) => b.signal_score - a.signal_score || b.d200 - a.d200)
        .slice(0, 4);

      if (candidates.length === 0) {
        topPicksContainer.innerHTML = '<div class="col-span-4 text-xs text-slate-400 py-2">今日暫未有符合 4 星之高勝率推介，建議耐心觀望。</div>';
        return;
      }

      topPicksContainer.innerHTML = candidates.map(d => `
        <div class="bg-slate-50 dark:bg-slate-800/60 rounded-lg p-3 border border-slate-200 dark:border-slate-700/60 hover:border-emerald-500/5
