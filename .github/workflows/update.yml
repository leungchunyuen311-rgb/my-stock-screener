name: Daily Stock Screener Update

on:
  schedule:
    # 每個交易日美股收市後執行：UTC 22:00（即香港時間週二至週六早上 06:00）
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊立即運行

permissions:
  contents: write

jobs:
  update-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Packages
        run: |
          pip install --upgrade pip
          pip install pandas yfinance

      - name: Run Screener Script
        run: |
          python screener.py

      - name: Commit & Push New Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add screener_data.json
          git diff --staged --quiet || (git commit -m "Auto update screener data [skip ci]" && git push)
