name: Daily Stock Screener Update

on:
  schedule:
    # 針對美股冬令時間 (EST)：香港時間 06:15 (UTC 22:15) 執行，收市後 1 小時確保歷史日線完全結算
    - cron: '15 22 * * 1-5'
    # 備用保險觸發：香港時間 07:15 (UTC 23:15)，防止 GitHub 隊列延遲或 Yahoo 數據補漏
    - cron: '15 23 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁隨時點擊「Run workflow」手動一鍵立即更新

# 關鍵權限：允許 Actions 寫入並推送代碼回倉庫 (解決 403 報錯)
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 執行量化篩選腳本
        run: |
          python screener.py

      - name: 提交並推送更新數據至 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add screener_data.json
          
          # 檢查是否有數據變動，有的話才提交 (移除 [skip ci] 避免阻斷 GitHub Pages 部署)
          if git diff --staged --quiet; then
            echo "沒有數據變動，無需提交。"
          else
            git commit -m "Auto-update stock data: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
