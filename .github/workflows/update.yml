name: Daily Stock Screener Update

on:
  schedule:
    # 第一班：香港時間早上 06:15 HKT (UTC 22:15)，確保美股冬令收市(05:00)後數據完全結算
    - cron: '15 22 * * 1-5'
    # 第二班（防漏跑雙重保險）：香港時間早上 07:15 HKT (UTC 23:15)
    - cron: '15 23 * * 1-5'
  workflow_dispatch:

# 關鍵權限：允許 Actions 寫入並推送代碼回倉庫 (解決 403 報錯)
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 執行量化篩選腳本
        run: |
          python screener.py

      - name: 提交並推送更新數據至 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add screener_data.json
          
          # 檢查是否有數據變動，有的話才提交
          if git diff --staged --quiet; then
            echo "沒有數據變動，無需提交。"
          else
            git commit -m "Auto-update stock data: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
          fi
